<!doctype html>
<html lang="es" class="vh-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trabajo-practico-3-riveros-diego</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="d-flex flex-column vh-100">
    <header>
      <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-warning">
        <div class="container-fluid">
          <a class="navbar-brand text-black" href="#">Los Simsomps</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarCollapse"
            aria-controls="navbarCollapse"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarCollapse">
            <form class="d-flex py-2" role="search">
              <input
                class="form-control text-black me-2"
                type="search"
                placeholder="Buscar"
                aria-label="Search"
              />
              <button class="btn btn-outline-dark" type="submit">Buscar</button>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="py-5">
        <div class="row py-5" id="cardPersonaje"></div>
      </section>
    </main>

    <footer
      class="d-flex justify-content-center align-items-center py-3 border-top mt-auto bg-warning"
    >
      <span class="mb-3 text-dark">&copy; 2026 Los Simsomps</span>
    </footer>

    <!-- modal -->

    <div class="modal fade" id="modalDetalle">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col">
                <div class="card border border-0">
                  <div class="text-center">
                    <img
                      src=""
                      class="card-img-top"
                      alt="..."
                      id="imgPj"
                      style="width: 18rem"
                    />
                  </div>
                  <div class="card-body row">
                    <h5 class="card-title text-center" id="nombrePj"></h5>
                    <p class="card-text" id="edadPj"></p>
                    <p class="card-text" id="fechaNacPj"></p>
                    <p class="card-text" id="generoPj"></p>
                    <p class="card-text" id="ocupacionPj"></p>
                    <p class="card-text" id="estadoPj"></p>
                    <!-- <p class="card-text" id="descripcionPj"></p> -->
                    <p class="card-text" id="frasesPj"></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
